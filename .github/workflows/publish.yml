name: Publish to PyPI

# Runs only when a GitHub release is published. No secrets: PyPI trusts this workflow through
# OIDC (a trusted publisher for project "forgeproof", workflow publish.yml, environment pypi).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag must equal the version in the code
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          c=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/forgeproof/__init__.py').read()).group(1))")
          echo "tag=${GITHUB_REF_NAME} pyproject=$v code=$c"
          test "v$v" = "${GITHUB_REF_NAME}" && test "$v" = "$c"
      - name: Build the sdist and the wheel
        run: python -m pip install build==1.2.2 && python -m build
      - name: The wheel holds the package and the one-release alias
        run: |
          python -m zipfile -l dist/forgeproof_cli-*.whl | grep -q "forgeproof/cli.py"
          python -m zipfile -l dist/forgeproof_cli-*.whl | grep -q "forge_gate/__init__.py"
          ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
